<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Tech System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            /* IMAGEM DE FUNDO */
            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.45),
                    rgba(0, 0, 0, 0.45)
                ),
                url("https://cdn.pixabay.com/photo/2023/03/02/20/51/ai-generated-7826479_1280.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        main {
            width: 90%;
            max-width: 400px;
            padding: 35px;

            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);

            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;

            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);

            color: white;
            text-align: center;
        }

        h1 {
            margin-bottom: 5px;
            font-size: 32px;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 18px;
            font-weight: normal;
            color: #2EFFF5;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        label {
            text-align: left;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            box-shadow: 0 0 8px #2EFFF5;
        }

        button {
            margin-top: 15px;
            padding: 13px;

            border: none;
            border-radius: 8px;

            background: #2EFFF5;
            color: #222;

            font-size: 16px;
            font-weight: bold;
            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            background: white;
            transform: scale(1.03);
        }

        a {
            color: #2EFFF5;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        p {
            margin-top: 20px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <main>

        <h1>Tech System</h1>

        <h2>Área de Login</h2>

        <form>

            <label for="usuario">Usuário:</label>

            <input
                type="text"
                id="usuario"
                placeholder="Digite seu usuário"
                required
            >

            <label for="senha">Senha:</label>

            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                required
            >

            <button type="submit">
                Entrar
            </button>

        </form>

        <p>
            <a href="#">
                Esqueci minha senha
            </a>
        </p>

        <p>
            Ainda não possui uma conta?
            <a href="#">
                Cadastre-se
            </a>
        </p>

    </main>

</body>
</html>
