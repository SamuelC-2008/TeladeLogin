<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <title>Login - Tech System</title>

    <style>
        * {
            box-sizing: border-box;
        }

            margin: 0;

<body>

    <main>

        <h1>Tech System</h1>

        <h2>Área de Login</h2>

        <form id="formLogin">

            <label for="usuario">Usuário:</label>

            <input
                type="text"
                id="usuario"
                placeholder="Digite seu usuário"
                required
            >

            <label for="senha">Senha:</label>

            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                required
            >

            <button type="submit">
                Entrar
            </button>

        </form>

        <p id="mensagem"></p>

        <p>
            <a href="#">
                Esqueci minha senha
            </a>
        </p>

        <p>
            Ainda não possui uma conta?
            <a href="#">
                Cadastre-se
            </a>
        </p>

    </main>

    <script>
        const formLogin = document.getElementById("formLogin");

        formLogin.addEventListener("submit", function(event) {

            event.preventDefault();

            const usuario = document.getElementById("usuario").value;
            const senha = document.getElementById("senha").value;
            const mensagem = document.getElementById("mensagem");

            // Busca os usuários salvos pelo cadastro.
            // Se não houver usuários, utiliza uma lista vazia.
            const usuarios = JSON.parse(
                localStorage.getItem("usuarios")
            ) || [];

            // Guarda o usuário encontrado.
            let usuarioEncontrado = null;

            // Login de teste do administrador.
            if (usuario === "admin" && senha === "1234") {
                usuarioEncontrado = {
                    nome: "Administrador"
                };
            }

            // Procura o usuário e a senha na lista de cadastrados.
            for (let i = 0; i < usuarios.length; i++) {

                if (
                    usuarios[i].usuario === usuario &&
                    usuarios[i].senha === senha
                ) {
                    usuarioEncontrado = usuarios[i];
                    break;
                }
            }

            // Verifica se o login foi válido.
            if (usuarioEncontrado !== null) {

                // Guarda o nome do usuário que entrou.
                localStorage.setItem(
                    "usuarioLogado",
                    usuarioEncontrado.nome
                );

                mensagem.textContent =
                    "Login realizado! Entrando...";

                mensagem.style.color = "green";

                setTimeout(function() {
                    window.location.href = "index.html";
                }, 500);

            } else {

                mensagem.textContent =
                    "Usuário ou senha incorretos.";

                mensagem.style.color = "red";
            }

        });
    </script>

</body>
</html>
